name: shared_media
description: Picking, uploading and showing images and video, shared by the feed and chat (and any future app split out of them).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4

# Deliberately no dependency on the news_feed_flutter app: an app plugs in
# its server and logged-in user by overriding mediaApiProvider.
dependencies:
  cached_network_image: ^4.0.6
  fc_native_video_thumbnail: ^4.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.2.2
  image: ^4.12.0
  image_picker: ^1.2.4
  shared_preferences: ^2.3.3
  # "Download": hands a video's link to the browser or system to save.
  url_launcher: ^6.3.2
  video_compress: ^3.1.4
  video_player: ^2.14.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
