name: payments_kit
description: "Paying through the server's payments module: Razorpay's checkout sheet (phone SDK or Checkout.js), orders, and money. Shared by every mini-app that sells something (event tickets, taxi fares)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../app_core
  flutter_riverpod: ^3.4.3
  geo_kit:
    path: ../geo_kit
  http: ^1.2.2
  intl: ^0.20.3
  razorpay_flutter: ^1.4.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
