name: chat_store
description: Chat messages kept on the device (SQLite via drift), synced from the server by per-conversation sequence numbers, with local full-text search. Knows nothing about the app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
