name: oidc_auth
description: Sign-in with any OpenID Connect provider (Zitadel today) using the authorization code flow with PKCE, plus token storage and refresh. Knows nothing about the app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
