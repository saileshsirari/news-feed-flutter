name: feature_communities
description: "The communities mini-app: communities, events, near me, and event tickets."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4

# app_core, plus feature_feed's post widgets (a community's page shows its
# posts): one way only; the feed opens communities by link.
dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../app_core
  feature_feed:
    path: ../feature_feed
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  geo_kit:
    path: ../geo_kit
  http: ^1.2.2
  intl: ^0.20.3
  # Paying for tickets: the checkout sheet and orders, shared with taxi.
  payments_kit:
    path: ../payments_kit
  shared_media:
    path: ../shared_media
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.3
