[toolchain]
# The build hook (native_toolchain_rust) needs an exact version, so every
# machine builds the same thing. Only the platforms the app ships on.
channel = "1.99.1"
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "wasm32-unknown-unknown",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
]
